<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-label="Turnpike 重建题的一组点，以及找到 0、3、5、6、8、10 的主要分支">
  <defs>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#c75252" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1}
    .edge{stroke:#667085;stroke-width:1.8;fill:none}
    .edge-good{stroke:#2e7d32;stroke-width:2.4;fill:none}
    .edge-bad{stroke:#c75252;stroke-width:1.7;fill:none;stroke-dasharray:5 5}
    .node{fill:#ffffff;stroke:#667085;stroke-width:1.8}
    .node-root{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.2}
    .node-bad{fill:#f9eded;stroke:#c75252;stroke-width:1.8}
    .node-max{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-min{fill:#f9eded;stroke:#c75252;stroke-width:2}
    .pruned{fill:#34384a;stroke:#202431;stroke-width:2}
    .txt{fill:#1f2330;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .txt-light{fill:#ffffff;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-size:20px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .lbl-left{fill:#3c4043;font-size:15px;font-weight:500;dominant-baseline:central}
    .small{fill:#5f6673;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .good{fill:#2e7d32;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bad{fill:#b63c3c;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bound{fill:#b23a3a;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .board-edge{stroke:#4c5260;stroke-width:2;fill:none}
    .cell-a{fill:#fbfbf7}
    .cell-b{fill:#e7e3d8}
    .cell-q{fill:#dce5ff;stroke:#3f51b5;stroke-width:2}
    .queen{fill:#243b84;font-size:27px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .axis{stroke:#667085;stroke-width:2;fill:none}
    .tick{stroke:#9aa1ad;stroke-width:1.2;fill:none}
    .point{fill:#3f51b5;stroke:#243b84;stroke-width:1.5}
    .distance{fill:#dce5ff;stroke:#8798d8;stroke-width:1.2}
    .distance-t{fill:#243b84;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .chip{fill:#ffffff;stroke:#9aa1ad;stroke-width:1.3}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .edge{stroke:#9aa0ae}
      .edge-good{stroke:#81c784}
      .edge-bad{stroke:#ef9a9a}
      .node{fill:#292e3d;stroke:#9aa0ae}
      .node-root{fill:#303a64;stroke:#9fa8da}
      .node-good{fill:#24452f;stroke:#81c784}
      .node-bad{fill:#4a292b;stroke:#ef9a9a}
      .node-max{fill:#303a64;stroke:#9fa8da}
      .node-min{fill:#4a292b;stroke:#ef9a9a}
      .pruned{fill:#11131b;stroke:#e0e3eb}
      .txt{fill:#eef0f6}
      .txt-light{fill:#f7f8fb}
      .cap{fill:#aeb8ff}
      .lbl{fill:#d6d9e2}
      .lbl-left{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .good{fill:#a5d6a7}
      .bad{fill:#ef9a9a}
      .bound{fill:#ff9e9e}
      .board-edge{stroke:#d6d9e2}
      .cell-a{fill:#2a2f3d}
      .cell-b{fill:#373d4d}
      .cell-q{fill:#374579;stroke:#aeb8ff}
      .queen{fill:#eef1ff}
      .axis{stroke:#aeb4c2}
      .tick{stroke:#737b8d}
      .point{fill:#9fa8da;stroke:#e8eaf6}
      .distance{fill:#303a64;stroke:#7d8bc8}
      .distance-t{fill:#eef0ff}
      .chip{fill:#2b3040;stroke:#858da0}
    }
  </style>  <rect class="panel" x="22" y="22" width="996" height="566" rx="16"/>
  <text class="cap" x="520" y="50">端点确定后，逐个尝试剩余的最大距离</text>
  <line class="axis" x1="82" y1="105" x2="962" y2="105"/>
  <line class="tick" x1="82" y1="99" x2="82" y2="111"/>
  <text class="small" x="82" y="129">0</text>
  <line class="tick" x1="170" y1="99" x2="170" y2="111"/>
  <text class="small" x="170" y="129">1</text>
  <line class="tick" x1="258" y1="99" x2="258" y2="111"/>
  <text class="small" x="258" y="129">2</text>
  <line class="tick" x1="346" y1="99" x2="346" y2="111"/>
  <text class="small" x="346" y="129">3</text>
  <line class="tick" x1="434" y1="99" x2="434" y2="111"/>
  <text class="small" x="434" y="129">4</text>
  <line class="tick" x1="522" y1="99" x2="522" y2="111"/>
  <text class="small" x="522" y="129">5</text>
  <line class="tick" x1="610" y1="99" x2="610" y2="111"/>
  <text class="small" x="610" y="129">6</text>
  <line class="tick" x1="698" y1="99" x2="698" y2="111"/>
  <text class="small" x="698" y="129">7</text>
  <line class="tick" x1="786" y1="99" x2="786" y2="111"/>
  <text class="small" x="786" y="129">8</text>
  <line class="tick" x1="874" y1="99" x2="874" y2="111"/>
  <text class="small" x="874" y="129">9</text>
  <line class="tick" x1="962" y1="99" x2="962" y2="111"/>
  <text class="small" x="962" y="129">10</text>
  <circle class="point" cx="82" cy="105" r="7"/>
  <text class="txt" x="82" y="106"></text>
  <text class="lbl" x="82" y="81">0</text>
  <circle class="point" cx="346" cy="105" r="7"/>
  <text class="txt" x="346" y="106"></text>
  <text class="lbl" x="346" y="81">3</text>
  <circle class="point" cx="522" cy="105" r="7"/>
  <text class="txt" x="522" y="106"></text>
  <text class="lbl" x="522" y="81">5</text>
  <circle class="point" cx="610" cy="105" r="7"/>
  <text class="txt" x="610" y="106"></text>
  <text class="lbl" x="610" y="81">6</text>
  <circle class="point" cx="786" cy="105" r="7"/>
  <text class="txt" x="786" y="106"></text>
  <text class="lbl" x="786" y="81">8</text>
  <circle class="point" cx="962" cy="105" r="7"/>
  <text class="txt" x="962" y="106"></text>
  <text class="lbl" x="962" y="81">10</text>
  <text class="lbl" x="520" y="160">15 个两两距离推出 N = 6；最大距离 10 给出 x₁ = 0、x₆ = 10</text>
  <line class="edge" x1="520" y1="220" x2="520" y2="265"/>
  <circle class="node-root" cx="520" cy="220" r="21"/>
  <text class="txt" x="520" y="221">10</text>
  <circle class="node-root" cx="520" cy="286" r="30"/>
  <text class="txt" x="520" y="287">x₅ = 8</text>
  <line class="edge-bad" x1="520" y1="316" x2="360" y2="372"/>
  <line class="edge-good" x1="520" y1="316" x2="680" y2="372"/>
  <circle class="node-bad" cx="360" cy="402" r="30"/>
  <text class="bad" x="360" y="403">x₄ = 7</text>
  <circle class="node-good" cx="680" cy="402" r="30"/>
  <text class="txt" x="680" y="403">x₂ = 3</text>
  <line class="edge-bad" x1="360" y1="432" x2="360" y2="488"/>
  <circle class="node-bad" cx="360" cy="518" r="45"/>
  <text class="bad" x="360" y="519">两条子分支都失败</text>
  <line class="edge-good" x1="680" y1="432" x2="680" y2="488"/>
  <circle class="node-good" cx="680" cy="518" r="30"/>
  <text class="txt" x="680" y="519">x₄ = 6</text>
  <line class="edge-good" x1="680" y1="548" x2="840" y2="514"/>
  <circle class="node-good" cx="840" cy="514" r="30"/>
  <text class="txt" x="840" y="515">x₃ = 5</text>
  <path class="edge-bad" d="M395 402 C470 382 580 382 648 402" marker-end="url(#arrow-bad)"/>
  <text class="bad" x="522" y="370">撤销</text>
  <text class="good" x="840" y="560">距离集合清空，成功</text>
</svg>
