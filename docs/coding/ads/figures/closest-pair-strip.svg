<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="最近点对分治中的窄带检查：左图是跨中线检查，右图用八个小方格说明每个点最多只需再比较七个点">
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1.2}
    .panel-alt{fill:#ffffff;stroke:#d9dde7;stroke-width:1.2}
    .axis{stroke:#c4cad5;stroke-width:1.2}
    .split{stroke:#2e7d32;stroke-width:2.4}
    .strip{fill:#e7f4e8;opacity:.72}
    .grid{stroke:#aeb6c5;stroke-width:1.4;fill:none}
    .half-line{stroke:#2e7d32;stroke-width:2.2}
    .point{fill:#334155;stroke:#ffffff;stroke-width:2}
    .point-left{fill:#3f51b5;stroke:#ffffff;stroke-width:2}
    .point-right{fill:#8a5a00;stroke:#ffffff;stroke-width:2}
    .point-best{fill:#c75252;stroke:#ffffff;stroke-width:2.4}
    .point-p{fill:#2e7d32;stroke:#ffffff;stroke-width:2.4}
    .best{stroke:#c75252;stroke-width:2.5;fill:none}
    .guide{stroke:#7b8494;stroke-width:1.4;fill:none;stroke-dasharray:5 5}
    .title{fill:#1f2330;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .txt{fill:#1f2330;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:13.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .small{fill:#5f6673;font-size:12.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .accent{fill:#2e7d32;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .warn{fill:#a33b3b;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .panel-alt{fill:#292e3d;stroke:#41485c}
      .axis{stroke:#5d6578}
      .split{stroke:#81c784}
      .strip{fill:#24452f;opacity:.78}
      .grid{stroke:#687188}
      .half-line{stroke:#81c784}
      .point{fill:#d7dbe5;stroke:#292e3d}
      .point-left{fill:#9fa8da;stroke:#222635}
      .point-right{fill:#ffcc80;stroke:#222635}
      .point-best{fill:#ef9a9a;stroke:#222635}
      .point-p{fill:#81c784;stroke:#222635}
      .best{stroke:#ef9a9a}
      .guide{stroke:#a6acba}
      .title{fill:#eef0f6}
      .txt{fill:#eef0f6}
      .lbl{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .accent{fill:#a5d6a7}
      .warn{fill:#ef9a9a}
    }
  </style>  <rect class="panel" x="20" y="20" width="590" height="500" rx="16"/>
  <rect class="panel-alt" x="630" y="20" width="350" height="500" rx="16"/>
  <text class="title" x="315" y="52">递归结束后，跨中线的点对还要再查一次</text>
  <text class="title" x="805" y="52">一个点为什么只需再看 7 个点</text>
  <rect class="strip" x="225" y="82" width="180" height="394" rx="4"/>
  <line class="split" x1="315" y1="78" x2="315" y2="482"/>
  <line class="guide" x1="225" y1="78" x2="225" y2="482"/>
  <line class="guide" x1="405" y1="78" x2="405" y2="482"/>
  <text class="lbl" x="140" y="104">左半区</text>
  <text class="lbl" x="488" y="104">右半区</text>
  <text class="small" x="225" y="504">中线 − δ</text>
  <text class="accent" x="315" y="504">中线</text>
  <text class="small" x="405" y="504">中线 + δ</text>
  <circle class="point-left" cx="104" cy="158" r="6"/>
  <circle class="point-left" cx="168" cy="228" r="6"/>
  <circle class="point-left" cx="250" cy="314" r="6"/>
  <circle class="point-left" cx="292" cy="392" r="6"/>
  <circle class="point-left" cx="181" cy="438" r="6"/>
  <circle class="point-right" cx="493" cy="142" r="6"/>
  <circle class="point-right" cx="452" cy="246" r="6"/>
  <circle class="point-right" cx="368" cy="326" r="6"/>
  <circle class="point-right" cx="430" cy="410" r="6"/>
  <circle class="point-right" cx="521" cy="452" r="6"/>
  <line class="best" x1="104" y1="158" x2="168" y2="228"/>
  <line class="best" x1="493" y1="142" x2="452" y2="246"/>
  <circle class="point-best" cx="292" cy="392" r="8"/>
  <circle class="point-best" cx="368" cy="326" r="8"/>
  <line class="best" x1="292" y1="392" x2="368" y2="326"/>
  <text class="warn" x="335" y="348">跨中线候选</text>
  <text class="lbl" x="315" y="145">先分别递归左右两半</text>
  <text class="lbl" x="315" y="466">只比较 |x − 中线| &lt; δ 的点</text>
  <rect class="strip" x="690" y="108" width="260" height="130" rx="3"/>
  <rect class="grid" x="690" y="108" width="260" height="130" rx="3"/>
  <line class="grid" x1="755" y1="108" x2="755" y2="238"/>
  <line class="grid" x1="820" y1="108" x2="820" y2="238"/>
  <line class="grid" x1="885" y1="108" x2="885" y2="238"/>
  <line class="grid" x1="690" y1="173" x2="950" y2="173"/>
  <line class="half-line" x1="820" y1="90" x2="820" y2="256"/>
  <circle class="point-p" cx="718" cy="138" r="7"/>
  <circle class="point" cx="784" cy="144" r="7"/>
  <circle class="point" cx="848" cy="136" r="7"/>
  <circle class="point" cx="918" cy="145" r="7"/>
  <circle class="point" cx="723" cy="202" r="7"/>
  <circle class="point" cx="787" cy="209" r="7"/>
  <circle class="point" cx="853" cy="200" r="7"/>
  <circle class="point" cx="921" cy="210" r="7"/>
  <text class="accent" x="718" y="162">pᵢ</text>
  <text class="txt" x="805" y="272">每个小格最多一个点</text>
  <text class="small" x="805" y="306">小格边长 δ/2，对角线长度为 δ/√2 &lt; δ</text>
  <text class="small" x="805" y="334">否则同一半区就出现了距离小于 δ 的点对</text>
  <text class="txt" x="805" y="378">矩形最多 8 个点</text>
  <text class="accent" x="805" y="410">扣掉 pᵢ，后面最多再检查 7 个</text>
  <text class="lbl" x="805" y="466">按 y 排序后，再按这个局部窗口扫描</text>
</svg>
