<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" role="img" aria-label="Npl 的定义与左倾性质">
  <style>
    .edge{stroke:#5f6368;stroke-width:1.6;fill:none}
    .path{stroke:#d84343;stroke-width:2.2;fill:none}
    .n{fill:#ffffff;stroke:#3f51b5;stroke-width:1.8}
    .heavy{fill:#37474f;stroke:#263238;stroke-width:1.8}
    .key{fill:#1f2330;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .keyw{fill:#ffffff;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .badge{fill:#eef1ff;stroke:#3f51b5;stroke-width:1.2}
    .badgetxt{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:10.5px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
    .lbl{fill:#3c4043;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13.5px;font-weight:500}
    .mark{fill:#d84343;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .ok{fill:#2e7d32;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .mk{fill:#5f6368}
    @media (prefers-color-scheme: dark){
      .edge{stroke:#9aa0a6}
      .path{stroke:#ef9a9a}
      .n{fill:#262a3a;stroke:#9fa8da}
      .heavy{fill:#455a64;stroke:#90a4ae}
      .key{fill:#e8eaf6}
      .keyw{fill:#ffffff}
      .badge{fill:#33406b;stroke:#9fa8da}
      .badgetxt{fill:#c5cae9}
      .cap{fill:#9fa8da}
      .lbl{fill:#c7cad6}
      .mark{fill:#ef9a9a}
      .ok{fill:#a5d6a7}
      .mk{fill:#9aa0a6}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="cap" x="200" y="40">满足左倾性质</text>
  <text class="cap" x="650" y="40">不满足左倾性质</text>
  <line class="edge" x1="200" y1="109" x2="130" y2="156"/>
  <line class="edge" x1="200" y1="109" x2="270" y2="156"/>
  <line class="edge" x1="130" y1="194" x2="95" y2="241"/>
  <line class="edge" x1="130" y1="194" x2="165" y2="241"/>
  <circle class="n" cx="200" cy="90" r="19"/>
  <text class="key" x="200" y="91">1</text>
  <circle class="n" cx="130" cy="175" r="19"/>
  <text class="key" x="130" y="176">1</text>
  <circle class="n" cx="270" cy="175" r="19"/>
  <text class="key" x="270" y="176">0</text>
  <circle class="n" cx="95" cy="260" r="19"/>
  <text class="key" x="95" y="261">0</text>
  <circle class="n" cx="165" cy="260" r="19"/>
  <text class="key" x="165" y="261">0</text>
  <text class="lbl" x="200" y="400" text-anchor="middle">每个节点：左孩子的 Npl ≥ 右孩子的 Npl</text>
  <text class="ok" x="340" y="175">✓</text>
  <line class="edge" x1="650" y1="109" x2="580" y2="156"/>
  <line class="edge" x1="650" y1="109" x2="720" y2="156"/>
  <line class="edge" x1="580" y1="194" x2="545" y2="241"/>
  <line class="edge" x1="580" y1="194" x2="615" y2="241"/>
  <line class="edge" x1="621" y1="277" x2="650" y2="326"/>
  <circle class="n" cx="650" cy="90" r="19"/>
  <text class="key" x="650" y="91">1</text>
  <circle class="n" cx="580" cy="175" r="19"/>
  <text class="key" x="580" y="176">1</text>
  <circle class="n" cx="720" cy="175" r="19"/>
  <text class="key" x="720" y="176">0</text>
  <circle class="n" cx="545" cy="260" r="19"/>
  <text class="key" x="545" y="261">0</text>
  <circle class="n" cx="615" cy="260" r="19"/>
  <text class="key" x="615" y="261">1</text>
  <circle class="n" cx="650" cy="345" r="19"/>
  <text class="key" x="650" y="346">0</text>
  <text class="mark" x="536" y="150">✗</text>
  <text class="lbl" x="650" y="400" text-anchor="middle">B 处左边是 0、右边是 1，违反了左倾性质</text>
</svg>
