  <line class="axis" x1="200" y1="96" x2="1000" y2="96"/>
  <text class="small" x="76" y="76">时间</text>
  <text class="txt-good" x="76" y="142">a1</text>
  <text class="small" x="133" y="142">[1,4)</text>
  <rect class="interval-good" x="250" y="131" width="150" height="22" rx="6"/>
  <text class="txt-good" x="325" y="142">a1</text>
  <text class="txt" x="76" y="180">a2</text>
  <text class="small" x="133" y="180">[3,5)</text>
  <rect class="interval" x="350" y="169" width="100" height="22" rx="6"/>
  <text class="lbl" x="400" y="180">a2</text>
  <text class="txt" x="76" y="218">a3</text>
  <text class="small" x="133" y="218">[0,6)</text>
  <rect class="interval" x="200" y="207" width="300" height="22" rx="6"/>
