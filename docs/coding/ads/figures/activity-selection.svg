  <line class="grid" x1="600" y1="92" x2="600" y2="515"/>
  <line class="axis" x1="600" y1="92" x2="600" y2="99"/>
  <text class="small" x="600" y="76">8</text>
  <line class="grid" x1="650" y1="92" x2="650" y2="515"/>
  <line class="axis" x1="650" y1="92" x2="650" y2="99"/>
  <line class="grid" x1="700" y1="92" x2="700" y2="515"/>
  <line class="axis" x1="700" y1="92" x2="700" y2="99"/>
  <text class="small" x="700" y="76">10</text>
  <line class="grid" x1="750" y1="92" x2="750" y2="515"/>
  <line class="axis" x1="750" y1="92" x2="750" y2="99"/>
  <line class="grid" x1="800" y1="92" x2="800" y2="515"/>
