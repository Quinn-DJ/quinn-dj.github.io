  <rect class="interval" x="350" y="283" width="300" height="22" rx="6"/>
  <text class="lbl" x="500" y="294">a5</text>
  <text class="txt" x="76" y="332">a6</text>
  <text class="small" x="133" y="332">[5,9)</text>
  <rect class="interval" x="450" y="321" width="200" height="22" rx="6"/>
  <text class="lbl" x="550" y="332">a6</text>
  <text class="txt" x="76" y="370">a7</text>
  <text class="small" x="133" y="370">[6,10)</text>
  <rect class="interval" x="500" y="359" width="200" height="22" rx="6"/>
  <text class="lbl" x="600" y="370">a7</text>
  <text class="txt-good" x="76" y="408">a8</text>
  <text class="small" x="133" y="408">[8,11)</text>
  <rect class="interval-good" x="600" y="397" width="150" height="22" rx="6"/>
  <text class="txt-good" x="675" y="408">a8</text>
  <text class="txt" x="76" y="446">a9</text>
  <text class="small" x="133" y="446">[8,12)</text>
  <rect class="interval" x="600" y="435" width="200" height="22" rx="6"/>
  <text class="lbl" x="700" y="446">a9</text>
  <text class="txt" x="76" y="484">a10</text>
  <text class="small" x="133" y="484">[2,14)</text>
  <rect class="interval" x="300" y="473" width="600" height="22" rx="6"/>
  <text class="lbl" x="600" y="484">a10</text>
  <text class="txt-good" x="76" y="522">a11</text>
  <text class="small" x="133" y="522">[12,16)</text>
  <rect class="interval-good" x="800" y="511" width="200" height="22" rx="6"/>
  <text class="txt-good" x="900" y="522">a11</text>
  <text class="accent" x="540" y="544">绿色：a1 → a4 → a8 → a11，共 4 个活动</text>
  <text class="small" x="540" y="570">a1 结束后资源空闲，a4 才能开始；换用更早开始的 a3 会挡住后面的候选</text>
</svg>
