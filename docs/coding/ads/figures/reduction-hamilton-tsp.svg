<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-label="多项式归约的方向，以及从 Hamilton 环到旅行商问题的构造：原图边权为 1，补边权为 2">
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1.2}
    .panel-alt{fill:#ffffff;stroke:#d9dde7;stroke-width:1.2}
    .np-region{fill:#eef1ff;stroke:#4b5bb7;stroke-width:2}
    .p-region{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2}
    .npc-region{fill:#fdecec;stroke:#b94a48;stroke-width:2}
    .co-region{fill:#fff4d6;stroke:#9a6700;stroke-width:2}
    .collapse{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.4}
    .box{fill:#ffffff;stroke:#667085;stroke-width:1.7}
    .box-a{fill:#fdecec;stroke:#b94a48;stroke-width:2.2}
    .box-b{fill:#eef1ff;stroke:#4b5bb7;stroke-width:2.2}
    .edge{stroke:#8c95a6;stroke-width:1.5;fill:none}
    .edge-good{stroke:#2e7d32;stroke-width:2.6;fill:none}
    .edge-warn{stroke:#c75252;stroke-width:1.7;fill:none;stroke-dasharray:5 5}
    .arrow{stroke:#667085;stroke-width:2;fill:none}
    .arrow-warn{stroke:#b94a48;stroke-width:2.2;fill:none}
    .lit{fill:#ffffff;stroke:#667085;stroke-width:1.7}
    .lit-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.4}
    .title{fill:#1f2330;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .txt{fill:#1f2330;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .txt-good{fill:#1f4f24;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .txt-warn{fill:#8f2929;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:13.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .small{fill:#5f6673;font-size:12px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .accent{fill:#2e7d32;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .warn{fill:#b63c3c;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .formula{fill:#1f2330;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .panel-alt{fill:#292e3d;stroke:#41485c}
      .np-region{fill:#29345f;stroke:#aeb8ff}
      .p-region{fill:#24452f;stroke:#81c784}
      .npc-region{fill:#4a292b;stroke:#ef9a9a}
      .co-region{fill:#493c22;stroke:#e2c26b}
      .collapse{fill:#24452f;stroke:#81c784}
      .box{fill:#292e3d;stroke:#a6acba}
      .box-a{fill:#4a292b;stroke:#ef9a9a}
      .box-b{fill:#303a64;stroke:#9fa8da}
      .edge{stroke:#a0a8b8}
      .edge-good{stroke:#81c784}
      .edge-warn{stroke:#ef9a9a}
      .arrow{stroke:#a6acba}
      .arrow-warn{stroke:#ef9a9a}
      .lit{fill:#292e3d;stroke:#a6acba}
      .lit-good{fill:#24452f;stroke:#81c784}
      .title{fill:#eef0f6}
      .txt{fill:#eef0f6}
      .txt-good{fill:#c8e6c9}
      .txt-warn{fill:#ffcdd2}
      .lbl{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .accent{fill:#a5d6a7}
      .warn{fill:#ef9a9a}
      .formula{fill:#eef0f6}
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path fill="#667085" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path fill="#b94a48" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <style>
      @media (prefers-color-scheme: dark){
        marker#arrow path{fill:#a6acba}
        marker#arrow-warn path{fill:#ef9a9a}
      }
    </style>
  </defs>  <rect class="panel" x="20" y="20" width="530" height="610" rx="16"/>
  <rect class="panel-alt" x="570" y="20" width="570" height="610" rx="16"/>
  <text class="title" x="285" y="52">想证明 B 难，从已知难的 A 归约到 B</text>
  <text class="title" x="855" y="52">Hamilton 环归约到 TSP</text>
  <rect class="box-a" x="42.5" y="133" width="125" height="74" rx="9"/>
  <text class="txt" x="105" y="156">A 的实例 x</text>
  <text class="small" x="105" y="184">A 已知为 NPC</text>
  <rect class="box-b" x="402.5" y="133" width="125" height="74" rx="9"/>
  <text class="txt" x="465" y="156">B 的实例 f(x)</text>
  <text class="small" x="465" y="184">待证明的问题</text>
  <line class="arrow" x1="168" y1="170" x2="402" y2="170" marker-end="url(#arrow)"/>
  <text class="lbl" x="285" y="148">多项式时间 f</text>
  <text class="accent" x="285" y="204">yes ↔ yes，no ↔ no</text>
  <text class="title" x="285" y="270">记作：A 的多项式归约 → B</text>
  <text class="lbl" x="285" y="314">若 B 有多项式算法，则 A 也有</text>
  <text class="lbl" x="285" y="344">这就是 B 至少和 A 一样难的理由</text>
  <rect class="panel" x="72" y="390" width="426" height="170" rx="12"/>
  <text class="warn" x="285" y="418">最常见的错误方向</text>
  <text class="lbl" x="285" y="457">只把 B 的某个实例变成 A</text>
  <text class="lbl" x="285" y="487">不能说明所有 NP 问题都能变成 B</text>
  <text class="small" x="285" y="532">证明 NPC 时，箭头要从已知难问题指向目标问题</text>
  <line class="edge-good" x1="855" y1="95" x2="978.6373471183699" y2="184.82779073125684"/>
  <line class="edge-good" x1="978.6373471183699" y1="184.82779073125684" x2="931.4120827980215" y2="330.1722092687432"/>
  <line class="edge-good" x1="931.4120827980215" y1="330.1722092687432" x2="778.5879172019785" y2="330.1722092687432"/>
  <line class="edge-good" x1="778.5879172019785" y1="330.1722092687432" x2="731.3626528816301" y2="184.82779073125687"/>
  <line class="edge-good" x1="731.3626528816301" y1="184.82779073125687" x2="855" y2="95"/>
  <line class="edge-warn" x1="855" y1="95" x2="931.4120827980215" y2="330.1722092687432"/>
  <line class="edge-warn" x1="855" y1="95" x2="778.5879172019785" y2="330.1722092687432"/>
  <line class="edge-warn" x1="978.6373471183699" y1="184.82779073125684" x2="778.5879172019785" y2="330.1722092687432"/>
  <line class="edge-warn" x1="978.6373471183699" y1="184.82779073125684" x2="731.3626528816301" y2="184.82779073125687"/>
  <line class="edge-warn" x1="931.4120827980215" y1="330.1722092687432" x2="731.3626528816301" y2="184.82779073125687"/>
  <circle class="box-b" cx="855" cy="95" r="22"/>
  <text class="txt" x="855" y="95">1</text>
  <circle class="box-b" cx="978.6373471183699" cy="184.82779073125684" r="22"/>
  <text class="txt" x="978.6373471183699" y="184.82779073125684">2</text>
  <circle class="box-b" cx="931.4120827980215" cy="330.1722092687432" r="22"/>
  <text class="txt" x="931.4120827980215" y="330.1722092687432">3</text>
  <circle class="box-b" cx="778.5879172019785" cy="330.1722092687432" r="22"/>
  <text class="txt" x="778.5879172019785" y="330.1722092687432">4</text>
  <circle class="box-b" cx="731.3626528816301" cy="184.82779073125687" r="22"/>
  <text class="txt" x="731.3626528816301" y="184.82779073125687">5</text>
  <text class="accent" x="855" y="395">绿色边：原图 G 中的边，权为 1</text>
  <text class="warn" x="855" y="424">红色虚线：补边，权为 2</text>
  <text class="lbl" x="855" y="468">K = |V| = 5</text>
  <text class="title" x="855" y="505">G 有 Hamilton 环 ⇔ G′ 有总权 5 的 TSP 环</text>
  <text class="small" x="855" y="548">任何权 ≤ 5 的 tour 都只能走五条权 1 的边</text>
  <text class="small" x="855" y="580">所以这些边全部来自 G，正好构成一个 Hamilton 环</text>
</svg>
