      .bin-line{stroke:#222635}
      .i0{fill:#485986;stroke:#222635}
      .i1{fill:#3f6746;stroke:#222635}
      .i2{fill:#81642d;stroke:#222635}
      .i3{fill:#754349;stroke:#222635}
      .i4{fill:#35636b;stroke:#222635}
      .i5{fill:#5c4774;stroke:#222635}
