<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="450" viewBox="0 0 1020 450" role="img" aria-label="两条装配线、四个工位的调度图，绿色路径表示总时间 13 的最优方案">
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1.2}
    .edge{stroke:#667085;stroke-width:1.7;fill:none}
    .edge-good{stroke:#2e7d32;stroke-width:2.5;fill:none}
    .edge-move{stroke:#8a90a0;stroke-width:1.5;fill:none;stroke-dasharray:5 5}
    .box{fill:#ffffff;stroke:#667085;stroke-width:1.6}
    .box-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.3}
    .dot{fill:#eef1ff;stroke:#3f51b5;stroke-width:1.8}
    .dot-repeat{fill:#fdecec;stroke:#c75252;stroke-width:2}
    .dot-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2}
    .txt{fill:#1f2330;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .txt-good{fill:#1f4f24;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .txt-repeat{fill:#8f2929;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .term{fill:#243b84;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:13.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .small{fill:#5f6673;font-size:12.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .good{fill:#2e7d32;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .repeat{fill:#b63c3c;font-size:14px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .edge{stroke:#a6acba}
      .edge-good{stroke:#81c784}
      .edge-move{stroke:#737b8d}
      .box{fill:#292e3d;stroke:#a6acba}
      .box-good{fill:#24452f;stroke:#81c784}
      .dot{fill:#303a64;stroke:#9fa8da}
      .dot-repeat{fill:#4a292b;stroke:#ef9a9a}
      .dot-good{fill:#24452f;stroke:#81c784}
      .txt{fill:#eef0f6}
      .txt-good{fill:#c8e6c9}
      .txt-repeat{fill:#ffcdd2}
      .term{fill:#c5caff}
      .cap{fill:#aeb8ff}
      .lbl{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .good{fill:#a5d6a7}
      .repeat{fill:#ef9a9a}
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path fill="#667085" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path fill="#2e7d32" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#8a90a0" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <style>
      @media (prefers-color-scheme: dark){
        marker#arrow path{fill:#a6acba}
        marker#arrow-good path{fill:#81c784}
        marker#arrow-move path{fill:#737b8d}
      }
    </style>
  </defs>  <rect class="panel" x="20" y="20" width="980" height="410" rx="16"/>
  <text class="cap" x="510" y="50">绿色路径：第 1 站在 1 号线，第 2 站之前换到 0 号线</text>
  <text class="term" x="95" y="115">装配线 0</text>
  <text class="term" x="95" y="275">装配线 1</text>
  <circle class="dot" cx="78" cy="225" r="34"/>
  <text class="txt" x="78" y="225">零件</text>
  <circle class="dot" cx="930" cy="225" r="34"/>
  <text class="txt" x="930" y="225">汽车</text>
  <rect class="box" x="200" y="116" width="110" height="58" rx="8"/>
  <text class="txt" x="255" y="136">第 1 站</text>
  <text class="small" x="255" y="159">工序 4</text>
  <rect class="box-good" x="200" y="276" width="110" height="58" rx="8"/>
  <text class="txt" x="255" y="296">第 1 站</text>
  <text class="good" x="255" y="319">工序 2</text>
  <rect class="box-good" x="375" y="116" width="110" height="58" rx="8"/>
  <text class="txt" x="430" y="136">第 2 站</text>
  <text class="good" x="430" y="159">工序 5</text>
  <rect class="box" x="375" y="276" width="110" height="58" rx="8"/>
  <text class="txt" x="430" y="296">第 2 站</text>
  <text class="small" x="430" y="319">工序 6</text>
  <rect class="box-good" x="550" y="116" width="110" height="58" rx="8"/>
  <text class="txt" x="605" y="136">第 3 站</text>
  <text class="good" x="605" y="159">工序 3</text>
  <rect class="box" x="550" y="276" width="110" height="58" rx="8"/>
  <text class="txt" x="605" y="296">第 3 站</text>
  <text class="small" x="605" y="319">工序 4</text>
  <rect class="box-good" x="725" y="116" width="110" height="58" rx="8"/>
  <text class="txt" x="780" y="136">第 4 站</text>
  <text class="good" x="780" y="159">工序 2</text>
  <rect class="box" x="725" y="276" width="110" height="58" rx="8"/>
  <text class="txt" x="780" y="296">第 4 站</text>
  <text class="small" x="780" y="319">工序 3</text>
  <line class="edge" x1="310" y1="145" x2="375" y2="145" marker-end="url(#arrow)"/>
  <line class="edge" x1="310" y1="305" x2="375" y2="305" marker-end="url(#arrow)"/>
  <line class="edge-good" x1="485" y1="145" x2="550" y2="145" marker-end="url(#arrow-good)"/>
  <line class="edge" x1="485" y1="305" x2="550" y2="305" marker-end="url(#arrow)"/>
  <line class="edge-good" x1="660" y1="145" x2="725" y2="145" marker-end="url(#arrow-good)"/>
  <line class="edge" x1="660" y1="305" x2="725" y2="305" marker-end="url(#arrow)"/>
  <line class="edge" x1="310" y1="145" x2="375" y2="305" marker-end="url(#arrow-move)"/>
  <line class="edge-good" x1="310" y1="305" x2="375" y2="145" marker-end="url(#arrow-good)"/>
  <line class="edge-move" x1="485" y1="145" x2="550" y2="305" marker-end="url(#arrow-move)"/>
  <line class="edge-move" x1="485" y1="305" x2="550" y2="145" marker-end="url(#arrow-move)"/>
  <line class="edge-move" x1="660" y1="145" x2="725" y2="305" marker-end="url(#arrow-move)"/>
  <line class="edge-move" x1="660" y1="305" x2="725" y2="145" marker-end="url(#arrow-move)"/>
  <line class="edge-good" x1="112" y1="225" x2="195" y2="305" marker-end="url(#arrow-good)"/>
  <line class="edge-good" x1="310" y1="305" x2="375" y2="145" marker-end="url(#arrow-good)"/>
  <line class="edge-good" x1="835" y1="145" x2="896" y2="225" marker-end="url(#arrow-good)"/>
  <text class="good" x="360" y="230">换线 +1</text>
  <text class="good" x="165" y="192">从 1 号线出发</text>
  <text class="good" x="865" y="175">到终点</text>
  <text class="lbl" x="510" y="380">时间：2 + 1 + 5 + 3 + 2 = 13</text>
  <text class="small" x="510" y="406">虚线是其他换线方向；是否换线由上一站的两条最优路径比较决定</text>
</svg>
