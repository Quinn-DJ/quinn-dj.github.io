<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-label="斜堆均摊分析里的重节点与轻节点">
  <style>
    .edge{stroke:#5f6368;stroke-width:1.6;fill:none}
    .path{stroke:#d84343;stroke-width:2.2;fill:none}
    .n{fill:#ffffff;stroke:#3f51b5;stroke-width:1.8}
    .heavy{fill:#37474f;stroke:#263238;stroke-width:1.8}
    .key{fill:#1f2330;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .keyw{fill:#ffffff;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .badge{fill:#eef1ff;stroke:#3f51b5;stroke-width:1.2}
    .badgetxt{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:10.5px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
    .lbl{fill:#3c4043;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13.5px;font-weight:500}
    .mark{fill:#d84343;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .ok{fill:#2e7d32;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .mk{fill:#5f6368}
    @media (prefers-color-scheme: dark){
      .edge{stroke:#9aa0a6}
      .path{stroke:#ef9a9a}
      .n{fill:#262a3a;stroke:#9fa8da}
      .heavy{fill:#455a64;stroke:#90a4ae}
      .key{fill:#e8eaf6}
      .keyw{fill:#ffffff}
      .badge{fill:#33406b;stroke:#9fa8da}
      .badgetxt{fill:#c5cae9}
      .cap{fill:#9fa8da}
      .lbl{fill:#c7cad6}
      .mark{fill:#ef9a9a}
      .ok{fill:#a5d6a7}
      .mk{fill:#9aa0a6}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <line class="edge" x1="430" y1="99" x2="280" y2="161"/>
  <line class="edge" x1="430" y1="99" x2="580" y2="161"/>
  <line class="edge" x1="280" y1="199" x2="200" y2="261"/>
  <line class="edge" x1="280" y1="199" x2="340" y2="261"/>
  <line class="edge" x1="580" y1="199" x2="500" y2="261"/>
  <line class="edge" x1="580" y1="199" x2="660" y2="261"/>
  <line class="edge" x1="660" y1="299" x2="710" y2="361"/>
  <circle class="heavy" cx="430" cy="80" r="20"/>
  <text class="keyw" x="430" y="81">1</text>
  <circle class="badge" cx="447" cy="65" r="9.5"/>
  <text class="badgetxt" x="447" y="66">8</text>

  <circle class="n" cx="280" cy="180" r="20"/>
  <text class="key" x="280" y="181">2</text>
  <circle class="badge" cx="297" cy="165" r="9.5"/>
  <text class="badgetxt" x="297" y="166">3</text>

  <circle class="n" cx="580" cy="180" r="20"/>
  <text class="key" x="580" y="181">3</text>
  <circle class="badge" cx="597" cy="165" r="9.5"/>
  <text class="badgetxt" x="597" y="166">5</text>

  <circle class="n" cx="200" cy="280" r="20"/>
  <text class="key" x="200" y="281">4</text>
  <circle class="badge" cx="217" cy="265" r="9.5"/>
  <text class="badgetxt" x="217" y="266">1</text>

  <circle class="n" cx="340" cy="280" r="20"/>
  <text class="key" x="340" y="281">5</text>
  <circle class="badge" cx="357" cy="265" r="9.5"/>
  <text class="badgetxt" x="357" y="266">1</text>

  <circle class="n" cx="500" cy="280" r="20"/>
  <text class="key" x="500" y="281">6</text>
  <circle class="badge" cx="517" cy="265" r="9.5"/>
  <text class="badgetxt" x="517" y="266">1</text>

  <circle class="heavy" cx="660" cy="280" r="20"/>
  <text class="keyw" x="660" y="281">7</text>
  <circle class="badge" cx="677" cy="265" r="9.5"/>
  <text class="badgetxt" x="677" y="266">2</text>

  <circle class="n" cx="710" cy="380" r="20"/>
  <text class="key" x="710" y="381">8</text>
  <circle class="badge" cx="727" cy="365" r="9.5"/>
  <text class="badgetxt" x="727" y="366">1</text>

  <text class="lbl" x="450" y="435" text-anchor="middle">深色是重节点（右子树节点数 ≥ 该节点子树节点数的一半），浅色是轻节点</text>
  <text class="lbl" x="450" y="460" text-anchor="middle">徽标里是子树节点数；合并只会改变右路径 1 → 3 → 7 → 8 上节点的轻重</text>
</svg>
