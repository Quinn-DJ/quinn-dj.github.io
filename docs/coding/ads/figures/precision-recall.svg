<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520" role="img" aria-label="Precision-Recall 平面">
  <style>
    .edge{stroke:#5f6368;stroke-width:1.6;fill:none}
    .box{fill:#f4f5f7;stroke:#9aa0a6;stroke-width:1.4}
    .step{fill:#eef1ff;stroke:#3f51b5;stroke-width:1.6}
    .cell{fill:#ffffff;stroke:#9aa0a6;stroke-width:1.2}
    .blk{fill:#fdf0e6;stroke:#c98a4b;stroke-width:1.4}
    .txt{fill:#1f2330;font-family:ui-sans-serif,-apple-system,'PingFang SC','Noto Sans SC',Arial,sans-serif;font-size:13.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .hd{fill:#3c4043;font-family:ui-sans-serif,-apple-system,'PingFang SC','Noto Sans SC',Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle}
    .term{fill:#1f2330;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-family:ui-sans-serif,-apple-system,'PingFang SC','Noto Sans SC',Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
    .lbl{fill:#3c4043;font-family:ui-sans-serif,-apple-system,'PingFang SC','Noto Sans SC',Arial,sans-serif;font-size:13.5px;font-weight:500}
    .axis{stroke:#5f6368;stroke-width:1.6;fill:none}
    .curve{stroke:#3f51b5;stroke-width:2.4;fill:none}
    .mk{fill:#5f6368}
    .pt{fill:#d84343;stroke:#b71c1c;stroke-width:1.4}
    @media (prefers-color-scheme: dark){
      .edge{stroke:#9aa0a6}
      .box{fill:#262a3a;stroke:#7a7f8f}
      .step{fill:#33406b;stroke:#9fa8da}
      .cell{fill:#2f3346;stroke:#7a7f8f}
      .blk{fill:#4a3524;stroke:#c98a4b}
      .txt{fill:#e8eaf6}
      .hd{fill:#c7cad6}
      .term{fill:#e8eaf6}
      .cap{fill:#9fa8da}
      .lbl{fill:#c7cad6}
      .axis{stroke:#9aa0a6}
      .curve{stroke:#9fa8da}
      .mk{fill:#9aa0a6}
      .pt{fill:#ef9a9a;stroke:#c62828}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <line class="axis" x1="110" y1="390" x2="710" y2="390"/>
  <line class="axis" x1="110" y1="390" x2="110" y2="80"/>
  <text class="txt" x="110" y="412">0</text>
  <text class="txt" x="86" y="390">0</text>
  <text class="txt" x="410" y="412">0.5</text>
  <text class="txt" x="86" y="235">0.5</text>
  <text class="txt" x="710" y="412">1</text>
  <text class="txt" x="86" y="80">1</text>
  <text class="txt" x="410" y="442">Recall 召回率</text>
  <text class="txt" x="40" y="235" transform="rotate(-90 40 235)">Precision 精确率</text>
  <polyline class="curve" points="140.0,92.4 230.0,117.2 350.0,160.6 440.0,197.8 530.0,241.2 620.0,290.8 698.0,352.8"/>
  <circle cx="710" cy="80" r="5" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text class="lbl" x="702" y="66" text-anchor="end">理想点 (1, 1)</text>
  <circle class="pt" cx="512" cy="235" r="6"/>
  <text class="lbl" x="524" y="255">例子：P = 0.50，R = 0.67</text>
  <text class="lbl" x="110" y="480">高精度、低召回：返回的都相关，但漏了很多</text>
  <text class="lbl" x="110" y="504">低精度、高召回：相关的基本都在，但混了不少无关的</text>
</svg>
