<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-label="倒排索引的构建流程">
  <style>
    .edge{stroke:#5f6368;stroke-width:1.6;fill:none}
    .box{fill:#f4f5f7;stroke:#9aa0a6;stroke-width:1.4}
    .step{fill:#eef1ff;stroke:#3f51b5;stroke-width:1.6}
    .cell{fill:#ffffff;stroke:#9aa0a6;stroke-width:1.2}
    .blk{fill:#fdf0e6;stroke:#c98a4b;stroke-width:1.4}
    .txt{fill:#1f2330;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13.5px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .hd{fill:#3c4043;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:14px;font-weight:600;text-anchor:middle}
    .term{fill:#1f2330;font-family:'LXGW WenKai Mono','LXGW WenKai',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
    .lbl{fill:#3c4043;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13.5px;font-weight:500}
    .axis{stroke:#5f6368;stroke-width:1.6;fill:none}
    .curve{stroke:#3f51b5;stroke-width:2.4;fill:none}
    .mk{fill:#5f6368}
    .pt{fill:#d84343;stroke:#b71c1c;stroke-width:1.4}
    @media (prefers-color-scheme: dark){
      .edge{stroke:#9aa0a6}
      .box{fill:#262a3a;stroke:#7a7f8f}
      .step{fill:#33406b;stroke:#9fa8da}
      .cell{fill:#2f3346;stroke:#7a7f8f}
      .blk{fill:#4a3524;stroke:#c98a4b}
      .txt{fill:#e8eaf6}
      .hd{fill:#c7cad6}
      .term{fill:#e8eaf6}
      .cap{fill:#9fa8da}
      .lbl{fill:#c7cad6}
      .axis{stroke:#9aa0a6}
      .curve{stroke:#9fa8da}
      .mk{fill:#9aa0a6}
      .pt{fill:#ef9a9a;stroke:#c62828}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="cap" x="490" y="45">构建流水线：读一个词，先过停用词和词干化，再查词典、插入倒排记录表</text>
  <rect class="step" x="45" y="84" width="150" height="52" rx="6"/>
  <text class="txt" x="120" y="111">Token Analyzer</text>
  <rect class="step" x="230" y="84" width="150" height="52" rx="6"/>
  <text class="txt" x="305" y="111">Stop Filter</text>
  <line class="edge" x1="195" y1="110" x2="230" y2="110" marker-end="url(#arrow)"/>
  <rect class="step" x="415" y="84" width="150" height="52" rx="6"/>
  <text class="txt" x="490" y="111">Word Stemming</text>
  <line class="edge" x1="380" y1="110" x2="415" y2="110" marker-end="url(#arrow)"/>
  <rect class="step" x="600" y="84" width="150" height="52" rx="6"/>
  <text class="txt" x="675" y="111">Vocabulary</text>
  <line class="edge" x1="565" y1="110" x2="600" y2="110" marker-end="url(#arrow)"/>
  <rect class="step" x="785" y="84" width="150" height="52" rx="6"/>
  <text class="txt" x="860" y="111">Insertor</text>
  <line class="edge" x1="750" y1="110" x2="785" y2="110" marker-end="url(#arrow)"/>
  <text class="cap" x="490" y="210">内存不够时：写一块到磁盘，最后归并</text>
  <rect class="box" x="75" y="272" width="190" height="56" rx="6"/>
  <text class="txt" x="170" y="301">内存中的倒排索引</text>
  <line class="edge" x1="268" y1="300" x2="336" y2="300" marker-end="url(#arrow)"/>
  <text class="lbl" x="302" y="260">内存满</text>
  <rect class="blk" x="332" y="272" width="96" height="56" rx="6"/>
  <text class="txt" x="380" y="301">Block 0</text>
  <rect class="blk" x="442" y="272" width="96" height="56" rx="6"/>
  <text class="txt" x="490" y="301">Block 1</text>
  <rect class="blk" x="552" y="272" width="96" height="56" rx="6"/>
  <text class="txt" x="600" y="301">Block 2</text>
  <line class="edge" x1="596" y1="300" x2="664" y2="300" marker-end="url(#arrow)"/>
  <text class="lbl" x="630" y="260">归并</text>
  <rect class="box" x="695" y="272" width="210" height="56" rx="6"/>
  <text class="txt" x="800" y="301">磁盘上的 Inverted Index</text>
  <text class="lbl" x="490" y="425">块式构建的代价是要多做一轮 I/O，换来的是内存占用可控</text>
</svg>
