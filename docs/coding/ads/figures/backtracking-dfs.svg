<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-label="四皇后的深度优先搜索树，首条解路径为 2、4、1、3">
  <defs>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#2e7d32" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path fill="#c75252" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1}
    .edge{stroke:#667085;stroke-width:1.8;fill:none}
    .edge-good{stroke:#2e7d32;stroke-width:2.4;fill:none}
    .edge-bad{stroke:#c75252;stroke-width:1.7;fill:none;stroke-dasharray:5 5}
    .node{fill:#ffffff;stroke:#667085;stroke-width:1.8}
    .node-root{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.2}
    .node-bad{fill:#f9eded;stroke:#c75252;stroke-width:1.8}
    .node-max{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-min{fill:#f9eded;stroke:#c75252;stroke-width:2}
    .pruned{fill:#34384a;stroke:#202431;stroke-width:2}
    .txt{fill:#1f2330;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .txt-light{fill:#ffffff;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-size:20px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .lbl-left{fill:#3c4043;font-size:15px;font-weight:500;dominant-baseline:central}
    .small{fill:#5f6673;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .good{fill:#2e7d32;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bad{fill:#b63c3c;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bound{fill:#b23a3a;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .board-edge{stroke:#4c5260;stroke-width:2;fill:none}
    .cell-a{fill:#fbfbf7}
    .cell-b{fill:#e7e3d8}
    .cell-q{fill:#dce5ff;stroke:#3f51b5;stroke-width:2}
    .queen{fill:#243b84;font-size:27px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .axis{stroke:#667085;stroke-width:2;fill:none}
    .tick{stroke:#9aa1ad;stroke-width:1.2;fill:none}
    .point{fill:#3f51b5;stroke:#243b84;stroke-width:1.5}
    .distance{fill:#dce5ff;stroke:#8798d8;stroke-width:1.2}
    .distance-t{fill:#243b84;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .chip{fill:#ffffff;stroke:#9aa1ad;stroke-width:1.3}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .edge{stroke:#9aa0ae}
      .edge-good{stroke:#81c784}
      .edge-bad{stroke:#ef9a9a}
      .node{fill:#292e3d;stroke:#9aa0ae}
      .node-root{fill:#303a64;stroke:#9fa8da}
      .node-good{fill:#24452f;stroke:#81c784}
      .node-bad{fill:#4a292b;stroke:#ef9a9a}
      .node-max{fill:#303a64;stroke:#9fa8da}
      .node-min{fill:#4a292b;stroke:#ef9a9a}
      .pruned{fill:#11131b;stroke:#e0e3eb}
      .txt{fill:#eef0f6}
      .txt-light{fill:#f7f8fb}
      .cap{fill:#aeb8ff}
      .lbl{fill:#d6d9e2}
      .lbl-left{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .good{fill:#a5d6a7}
      .bad{fill:#ef9a9a}
      .bound{fill:#ff9e9e}
      .board-edge{stroke:#d6d9e2}
      .cell-a{fill:#2a2f3d}
      .cell-b{fill:#373d4d}
      .cell-q{fill:#374579;stroke:#aeb8ff}
      .queen{fill:#eef1ff}
      .axis{stroke:#aeb4c2}
      .tick{stroke:#737b8d}
      .point{fill:#9fa8da;stroke:#e8eaf6}
      .distance{fill:#303a64;stroke:#7d8bc8}
      .distance-t{fill:#eef0ff}
      .chip{fill:#2b3040;stroke:#858da0}
    }
  </style>  <line class="edge" x1="480" y1="56" x2="130" y2="140"/>
  <line class="edge-good" x1="480" y1="56" x2="360" y2="140"/>
  <line class="edge" x1="480" y1="56" x2="590" y2="140"/>
  <line class="edge" x1="480" y1="56" x2="820" y2="140"/>
  <circle class="node-root" cx="480" cy="56" r="22"/>
  <text class="txt" x="480" y="57">根</text>
  <circle class="node" cx="130" cy="140" r="20"/>
  <text class="txt" x="130" y="141">1</text>
  <circle class="node-good" cx="360" cy="140" r="20"/>
  <text class="txt" x="360" y="141">2</text>
  <circle class="node" cx="590" cy="140" r="20"/>
  <text class="txt" x="590" y="141">3</text>
  <circle class="node" cx="820" cy="140" r="20"/>
  <text class="txt" x="820" y="141">4</text>
  <text class="lbl" x="260" y="88">x₁ = 1</text>
  <text class="good" x="420" y="92">x₁ = 2</text>
  <text class="lbl" x="550" y="88">x₁ = 3</text>
  <text class="lbl" x="720" y="88">x₁ = 4</text>
  <text class="bad" x="130" y="180">整枝无解，撤销</text>
  <text class="small" x="590" y="180">继续枚举时有解</text>
  <text class="small" x="820" y="180">继续枚举时无解</text>
  <path class="edge-bad" d="M130 120 C175 76 270 48 420 47" marker-end="url(#arrow-bad)"/>
  <text class="bad" x="280" y="54">回溯</text>
  <line class="edge-bad" x1="360" y1="160" x2="250" y2="224"/>
  <line class="edge-bad" x1="360" y1="160" x2="320" y2="224"/>
  <line class="edge-bad" x1="360" y1="160" x2="390" y2="224"/>
  <line class="edge-good" x1="360" y1="160" x2="460" y2="224"/>
  <circle class="node-bad" cx="250" cy="224" r="14"/>
  <text class="bad" x="250" y="225">1</text>
  <circle class="node-bad" cx="320" cy="224" r="14"/>
  <text class="bad" x="320" y="225">2</text>
  <circle class="node-bad" cx="390" cy="224" r="14"/>
  <text class="bad" x="390" y="225">3</text>
  <circle class="node-good" cx="460" cy="224" r="20"/>
  <text class="txt" x="460" y="225">4</text>
  <text class="small" x="355" y="202">x₂ = 1 … 4</text>
  <line class="edge-good" x1="460" y1="244" x2="390" y2="306"/>
  <line class="edge-bad" x1="460" y1="244" x2="460" y2="306"/>
  <line class="edge-bad" x1="460" y1="244" x2="530" y2="306"/>
  <line class="edge-bad" x1="460" y1="244" x2="600" y2="306"/>
  <circle class="node-good" cx="390" cy="306" r="20"/>
  <text class="txt" x="390" y="307">1</text>
  <circle class="node-bad" cx="460" cy="306" r="14"/>
  <text class="bad" x="460" y="307">2</text>
  <circle class="node-bad" cx="530" cy="306" r="14"/>
  <text class="bad" x="530" y="307">3</text>
  <circle class="node-bad" cx="600" cy="306" r="14"/>
  <text class="bad" x="600" y="307">4</text>
  <text class="small" x="505" y="284">x₃ = 1 … 4</text>
  <line class="edge-bad" x1="390" y1="326" x2="330" y2="390"/>
  <line class="edge-bad" x1="390" y1="326" x2="390" y2="390"/>
  <line class="edge-good" x1="390" y1="326" x2="450" y2="390"/>
  <circle class="node-bad" cx="330" cy="390" r="14"/>
  <text class="bad" x="330" y="391">1</text>
  <circle class="node-bad" cx="390" cy="390" r="14"/>
  <text class="bad" x="390" y="391">2</text>
  <circle class="node-good" cx="450" cy="390" r="20"/>
  <text class="txt" x="450" y="391">3</text>
  <text class="small" x="399" y="366">x₄ = 1 … 3</text>
  <rect class="chip" x="530" y="356" width="335" height="92" rx="12"/>
  <text class="cap" x="697" y="383">首次成功</text>
  <text class="good" x="697" y="415">(2, 4, 1, 3)</text>
  <text class="small" x="697" y="437">搜索到这里就可以返回</text>
  <path class="edge-good" d="M470 390 C500 390 505 392 525 396" marker-end="url(#arrow-good)"/>
  <text class="lbl" x="480" y="520">失败的同级分支先撤销，再试下一个候选；这就是“回溯”</text>
</svg>
