<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-label="极小化极大搜索中的 alpha 剪枝和 beta 剪枝示例">
  <style>
    text{font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif}
    .panel{fill:#f7f8fb;stroke:#d9dde7;stroke-width:1}
    .edge{stroke:#667085;stroke-width:1.8;fill:none}
    .edge-good{stroke:#2e7d32;stroke-width:2.4;fill:none}
    .edge-bad{stroke:#c75252;stroke-width:1.7;fill:none;stroke-dasharray:5 5}
    .node{fill:#ffffff;stroke:#667085;stroke-width:1.8}
    .node-root{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-good{fill:#e7f4e8;stroke:#2e7d32;stroke-width:2.2}
    .node-bad{fill:#f9eded;stroke:#c75252;stroke-width:1.8}
    .node-max{fill:#e8eefc;stroke:#3f51b5;stroke-width:2}
    .node-min{fill:#f9eded;stroke:#c75252;stroke-width:2}
    .pruned{fill:#34384a;stroke:#202431;stroke-width:2}
    .txt{fill:#1f2330;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .txt-light{fill:#ffffff;font-size:17px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-size:20px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .lbl{fill:#3c4043;font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .lbl-left{fill:#3c4043;font-size:15px;font-weight:500;dominant-baseline:central}
    .small{fill:#5f6673;font-size:13px;font-weight:500;text-anchor:middle;dominant-baseline:central}
    .good{fill:#2e7d32;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bad{fill:#b63c3c;font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .bound{fill:#b23a3a;font-size:22px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .board-edge{stroke:#4c5260;stroke-width:2;fill:none}
    .cell-a{fill:#fbfbf7}
    .cell-b{fill:#e7e3d8}
    .cell-q{fill:#dce5ff;stroke:#3f51b5;stroke-width:2}
    .queen{fill:#243b84;font-size:27px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    .axis{stroke:#667085;stroke-width:2;fill:none}
    .tick{stroke:#9aa1ad;stroke-width:1.2;fill:none}
    .point{fill:#3f51b5;stroke:#243b84;stroke-width:1.5}
    .distance{fill:#dce5ff;stroke:#8798d8;stroke-width:1.2}
    .distance-t{fill:#243b84;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .chip{fill:#ffffff;stroke:#9aa1ad;stroke-width:1.3}
    @media (prefers-color-scheme: dark){
      .panel{fill:#222635;stroke:#41485c}
      .edge{stroke:#9aa0ae}
      .edge-good{stroke:#81c784}
      .edge-bad{stroke:#ef9a9a}
      .node{fill:#292e3d;stroke:#9aa0ae}
      .node-root{fill:#303a64;stroke:#9fa8da}
      .node-good{fill:#24452f;stroke:#81c784}
      .node-bad{fill:#4a292b;stroke:#ef9a9a}
      .node-max{fill:#303a64;stroke:#9fa8da}
      .node-min{fill:#4a292b;stroke:#ef9a9a}
      .pruned{fill:#11131b;stroke:#e0e3eb}
      .txt{fill:#eef0f6}
      .txt-light{fill:#f7f8fb}
      .cap{fill:#aeb8ff}
      .lbl{fill:#d6d9e2}
      .lbl-left{fill:#d6d9e2}
      .small{fill:#b7bcc9}
      .good{fill:#a5d6a7}
      .bad{fill:#ef9a9a}
      .bound{fill:#ff9e9e}
      .board-edge{stroke:#d6d9e2}
      .cell-a{fill:#2a2f3d}
      .cell-b{fill:#373d4d}
      .cell-q{fill:#374579;stroke:#aeb8ff}
      .queen{fill:#eef1ff}
      .axis{stroke:#aeb4c2}
      .tick{stroke:#737b8d}
      .point{fill:#9fa8da;stroke:#e8eaf6}
      .distance{fill:#303a64;stroke:#7d8bc8}
      .distance-t{fill:#eef0ff}
      .chip{fill:#2b3040;stroke:#858da0}
    }
  </style>  <rect class="panel" x="22" y="22" width="476" height="546" rx="16"/>
  <rect class="panel" x="542" y="22" width="476" height="546" rx="16"/>
  <text class="cap" x="260" y="40">α 剪枝</text>
  <text class="cap" x="780" y="40">β 剪枝</text>
  <line class="edge" x1="260" y1="110" x2="150" y2="206"/>
  <line class="edge" x1="260" y1="110" x2="370" y2="206"/>
  <circle class="node-max" cx="260" cy="86" r="28"/>
  <text class="txt" x="260" y="87">44</text>
  <text class="cap" x="310" y="86" text-anchor="start">MAX</text>
  <circle class="node-min" cx="150" cy="232" r="28"/>
  <text class="txt" x="150" y="233">44</text>
  <text class="bad" x="150" y="182">MIN</text>
  <circle class="node-min" cx="370" cy="232" r="28"/>
  <text class="txt" x="370" y="233">40</text>
  <text class="bad" x="370" y="182">MIN</text>
  <line class="edge" x1="150" y1="260" x2="150" y2="330"/>
  <circle class="node" cx="150" cy="352" r="22"/>
  <text class="txt" x="150" y="353">…</text>
  <line class="edge" x1="370" y1="260" x2="305" y2="330"/>
  <line class="edge-bad" x1="370" y1="260" x2="410" y2="330"/>
  <circle class="node-max" cx="305" cy="352" r="26"/>
  <text class="txt" x="305" y="353">40</text>
  <text class="cap" x="305" y="314">MAX</text>
  <circle class="pruned" cx="410" cy="352" r="30"/>
  <text class="txt-light" x="410" y="353">?</text>
  <text class="bad" x="410" y="314">剪掉</text>
  <text class="bound" x="260" y="281">≥</text>
  <text class="lbl" x="260" y="430">MAX 已能保证 44</text>
  <text class="lbl" x="260" y="462">MIN 这个分支最多给 40</text>
  <text class="small" x="260" y="494">再搜也不会让根超过 44</text>
  <line class="edge" x1="780" y1="110" x2="670" y2="206"/>
  <line class="edge" x1="780" y1="110" x2="890" y2="206"/>
  <circle class="node-min" cx="780" cy="86" r="28"/>
  <text class="txt" x="780" y="87">44</text>
  <text class="bad" x="830" y="86" text-anchor="start">MIN</text>
  <circle class="node-max" cx="670" cy="232" r="28"/>
  <text class="txt" x="670" y="233">44</text>
  <text class="cap" x="670" y="182">MAX</text>
  <circle class="node-max" cx="890" cy="232" r="28"/>
  <text class="txt" x="890" y="233">68</text>
  <text class="cap" x="890" y="182">MAX</text>
  <line class="edge" x1="670" y1="260" x2="670" y2="330"/>
  <circle class="node" cx="670" cy="352" r="22"/>
  <text class="txt" x="670" y="353">…</text>
  <line class="edge" x1="890" y1="260" x2="825" y2="330"/>
  <line class="edge-bad" x1="890" y1="260" x2="930" y2="330"/>
  <circle class="node-min" cx="825" cy="352" r="26"/>
  <text class="txt" x="825" y="353">68</text>
  <text class="bad" x="825" y="314">MIN</text>
  <circle class="pruned" cx="930" cy="352" r="30"/>
  <text class="txt-light" x="930" y="353">?</text>
  <text class="bad" x="930" y="314">剪掉</text>
  <text class="bound" x="780" y="281">≤</text>
  <text class="lbl" x="780" y="430">MIN 已经拿到 44</text>
  <text class="lbl" x="780" y="462">MAX 这个分支至少能给 68</text>
  <text class="small" x="780" y="494">再搜也不会让根低于 44</text>
  <text class="lbl" x="520" y="548">共同条件：α ≥ β 时，当前结点剩余分支不可能改变上层决策</text>
</svg>
