<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="二项队列 DeleteMin 的四步">
  <style>
    .edge{stroke:#5f6368;stroke-width:1.6;fill:none}
    .sib{stroke:#d84343;stroke-width:1.8;fill:none;stroke-dasharray:5 4}
    .n{fill:#ffffff;stroke:#3f51b5;stroke-width:1.8}
    .key{fill:#1f2330;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .cap{fill:#3f51b5;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
    .lbl{fill:#3c4043;font-family:'LXGW WenKai','LXGW WenKai Screen','PingFang SC','Noto Sans SC',ui-sans-serif,-apple-system,Arial,sans-serif;font-size:13.5px;font-weight:500}
    .mono{fill:#3f51b5;font-family:'LXGW WenKai Mono','LXGW WenKai',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .mk{fill:#5f6368}
    @media (prefers-color-scheme: dark){
      .edge{stroke:#9aa0a6}
      .sib{stroke:#ef9a9a}
      .n{fill:#262a3a;stroke:#9fa8da}
      .key{fill:#e8eaf6}
      .cap{fill:#9fa8da}
      .lbl{fill:#c7cad6}
      .mono{fill:#9fa8da}
      .mk{fill:#9aa0a6}
    }
    .sibmk{fill:#d84343}
    @media (prefers-color-scheme: dark){ .sibmk{fill:#ef9a9a} }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="sibmk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <text class="cap" x="250" y="50" text-anchor="middle">H：插入 1..7 之后的队列（7 = 111₂）</text>
  <line class="edge" x1="152" y1="97" x2="132" y2="125"/>
  <line class="edge" x1="132" y1="159" x2="132" y2="187"/>
  <line class="edge" x1="152" y1="97" x2="172" y2="125"/>
  <circle class="n" cx="152" cy="80" r="17"/>
  <text class="key" x="152" y="81">1</text>
  <circle class="n" cx="132" cy="142" r="17"/>
  <text class="key" x="132" y="143">3</text>
  <circle class="n" cx="132" cy="204" r="17"/>
  <text class="key" x="132" y="205">4</text>
  <circle class="n" cx="172" cy="142" r="17"/>
  <text class="key" x="172" y="143">2</text>
  <line class="edge" x1="242" y1="97" x2="242" y2="125"/>
  <circle class="n" cx="242" cy="80" r="17"/>
  <text class="key" x="242" y="81">5</text>
  <circle class="n" cx="242" cy="142" r="17"/>
  <text class="key" x="242" y="143">6</text>
  <circle class="n" cx="312" cy="80" r="17"/>
  <text class="key" x="312" y="81">7</text>
  <text class="lbl" x="250" y="270" text-anchor="middle">Step 1：最小值 1 在 B₂ 的根上，O(log N)</text>
  <text class="cap" x="750" y="50" text-anchor="middle">H'：把 B₂ 整棵摘掉，O(1)</text>
  <line class="edge" x1="701" y1="97" x2="701" y2="125"/>
  <circle class="n" cx="701" cy="80" r="17"/>
  <text class="key" x="701" y="81">5</text>
  <circle class="n" cx="701" cy="142" r="17"/>
  <text class="key" x="701" y="143">6</text>
  <circle class="n" cx="771" cy="80" r="17"/>
  <text class="key" x="771" y="81">7</text>
  <text class="lbl" x="750" y="270" text-anchor="middle">剩下的 3 个节点：B₁ + B₀</text>
  <text class="cap" x="250" y="370" text-anchor="middle">H''：摘掉根 1，两个孩子变成独立的树，O(log N)</text>
  <line class="edge" x1="201" y1="417" x2="201" y2="445"/>
  <circle class="n" cx="201" cy="400" r="17"/>
  <text class="key" x="201" y="401">3</text>
  <circle class="n" cx="201" cy="462" r="17"/>
  <text class="key" x="201" y="463">4</text>
  <circle class="n" cx="271" cy="400" r="17"/>
  <text class="key" x="271" y="401">2</text>
  <text class="lbl" x="250" y="590" text-anchor="middle">孩子是 B₁ 和 B₀，按身高递减排好</text>
  <text class="cap" x="750" y="370" text-anchor="middle">Merge(H', H'')：6 = 110₂ → B₂ + B₁，O(log N)</text>
  <line class="edge" x1="695" y1="417" x2="675" y2="445"/>
  <line class="edge" x1="675" y1="479" x2="675" y2="507"/>
  <line class="edge" x1="695" y1="417" x2="715" y2="445"/>
  <circle class="n" cx="695" cy="400" r="17"/>
  <text class="key" x="695" y="401">3</text>
  <circle class="n" cx="675" cy="462" r="17"/>
  <text class="key" x="675" y="463">5</text>
  <circle class="n" cx="675" cy="524" r="17"/>
  <text class="key" x="675" y="525">6</text>
  <circle class="n" cx="715" cy="462" r="17"/>
  <text class="key" x="715" y="463">4</text>
  <line class="edge" x1="785" y1="417" x2="785" y2="445"/>
  <circle class="n" cx="785" cy="400" r="17"/>
  <text class="key" x="785" y="401">2</text>
  <circle class="n" cx="785" cy="462" r="17"/>
  <text class="key" x="785" y="463">7</text>
  <text class="lbl" x="750" y="590" text-anchor="middle">合并完还是 B₂ + B₁</text>
</svg>
